services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_DATABASE=clubdeleonesdedavid
      - DB_USERNAME=root
      - DB_PASSWORD=rootpassword

  db:
    image: mysql:5.7
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=clubdeleonesdedavid
    # Database data is persisted in Docker volume; SQL dumps not committed for security
